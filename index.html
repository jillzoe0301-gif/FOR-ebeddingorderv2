  <style>

    :root{
      --bg:#241f1a;
      --bg2:#2d261f;
      --panel:#342c25;
      --panel2:#3d342c;
      --field:#473d34;
      --text:#f2eadf;

      --line:#5a4c40;

    *{box-sizing:border-box}
    html,body{margin:0;height:100%;width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 0%,#3b3027 0,#241f1a 42%,#201c18 100%)}

    button.danger{border-color:#9d6257;color:#f0b0a2;background:#47312d}

    button:disabled{opacity:.38;cursor:not-allowed;transform:none}
    input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:6px 9px;background:var(--field);color:var(--text);width:100%;outline:none;min-height:34px}

    textarea{min-height:62px;resize:vertical;line-height:1.45}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:650}
    .app{display:block;min-height:100vh;width:100%;max-width:100%;overflow-x:hidden}
    .app-header{position:sticky;top:0;z-index:12;background:rgba(47,39,32,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(20,14,10,.2)}
    .brandbar{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:8px 24px}
    .brand{display:flex;align-items:center;gap:10px;color:#fff2e0;min-width:0}
    .brand img{width:46px;height:46px;flex:0 0 46px;border-radius:12px;object-fit:cover;object-position:center;border:0;box-shadow:0 6px 16px rgba(22,16,12,.25);background:transparent}
    .brand-copy{min-width:0}
    .brand strong{display:block;font-size:17px;font-weight:900;letter-spacing:.2px;line-height:1.2;white-space:nowrap}
    .brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:3px;line-height:1.3;white-space:nowrap}

    .grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}

    .stat .num{font-size:26px;font-weight:900;margin-top:6px;color:#f2c58e}

let buttonPointerGuard = null;
document.addEventListener('pointerdown', e=>{
  const btn = e.target && e.target.closest ? e.target.closest('button') : null;
  buttonPointerGuard = btn ? {btn, x:e.clientX, y:e.clientY, moved:false} : null;
}, true);
document.addEventListener('pointermove', e=>{
  if(!buttonPointerGuard) return;
  if(Math.abs(e.clientX - buttonPointerGuard.x) > 7 || Math.abs(e.clientY - buttonPointerGuard.y) > 7){
    buttonPointerGuard.moved = true;
  }
}, true);
document.addEventListener('click', e=>{
  const btn = e.target && e.target.closest ? e.target.closest('button') : null;
  if(buttonPointerGuard && buttonPointerGuard.moved && btn === buttonPointerGuard.btn){
    e.preventDefault();
    e.stopImmediatePropagation();
  }
  buttonPointerGuard = null;
}, true);


// 寬表格只在自己的區域內橫向捲動，避免滑到底後把手勢傳給整個視窗。
document.addEventListener('wheel', e=>{
  const target = e.target && e.target.closest ? e.target.closest('.table-wrap,.scroll-x') : null;
  if(!target || target.scrollWidth <= target.clientWidth + 1) return;
  const horizontalDelta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : (e.shiftKey ? e.deltaY : 0);
  if(!horizontalDelta) return;
  e.preventDefault();
  target.scrollLeft += horizontalDelta;
}, {passive:false, capture:true});

  if(!rule || rule.mode==='all') return true;

  if(!target){
    target=oldLines[0]; target.code=newCode;
    oldLines.shift();
  }
  const numericFields=['orderQty','addQty','returnQty','useStockQty','stockInQty','replenishQty','returnToStockQty','receivedQty'];
  oldLines.forEach(line=>{
    numericFields.forEach(k=>{ target[k]=Number(target[k]||0)+Number(line[k]||0); });
    if(!Number(target.price||0) && Number(line.price||0)) target.price=Number(line.price);

async function persistRemoteState(){

  const nextJSON = sharedJSON();
  if(nextJSON === lastSharedJSON){ setSyncStatus('ok','已同步'); return; }
  remoteSaving = true;
  setSyncStatus('saving','同步中');
  try{
    const {data, error} = await supabase.rpc('save_bedding_state', {
      p_data: JSON.parse(nextJSON),
      p_expected_revision: remoteRevision,
      p_client_id: CLIENT_ID
    });
    if(error) throw error;
    if(!data?.success){
      remoteConflict = true;
      remoteRevision = Number(data?.revision || remoteRevision);
      setSyncStatus('error','版本衝突，請重新整理');
      alert('資料已被其他使用者更新。為避免覆蓋他人資料，這次變更尚未寫入 Supabase。請先下載備份 JSON，再重新整理後重做本次操作。');

    }

  state.auditLogs.unshift({id:uid('AUD'), time:nowStamp(), source:'共用網址', action, targetType, targetId:targetId||'', targetName:targetName||'', detail:detail||'', snapshot:snapshot||null});
  if(state.auditLogs.length>500) state.auditLogs = state.auditLogs.slice(0,500);
}
function snapshotOrder(o){ return JSON.parse(JSON.stringify(o||{})); }
function can(){ return true; }
function $(sel, root=document){ return root.querySelector(sel); }
function $all(sel, root=document){ return Array.from(root.querySelectorAll(sel)); }
function esc(v){ return String(v ?? '').replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s])); }
function num(v){ const n = Number(v); return isFinite(n) ? n : 0; }
function money(v){ return 'NT$' + Math.round(num(v)).toLocaleString('zh-TW'); }
function vendorTaxIncludedPrice(v){ return Math.round(num(v)*1.05); }
function today(){ const d=new Date(); return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); }
function todayInput(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateSlash(v){ if(!v) return ''; return String(v).replaceAll('-','/'); }
function uid(prefix='ID'){ return prefix + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,6).toUpperCase(); }
function serial(prefix){
  const ymd = todayInput().replaceAll('-','');
  const n = state.settings.accountingSerial || 1;
  state.settings.accountingSerial = n + 1;
  return `AC${ymd}-${String(n).padStart(3,'0')}`;
}
function companyPrefix(title){
  const t=String(title||'');
  if(t.includes('灃康')) return 'FC';
  if(t.includes('灃禾')) return 'FW';
  if(t.includes('乾坤')) return 'WC';
  return 'OT';
}
function deptDigit(dept){ return String(dept||'').includes('二') ? '2' : '1'; }
function dateCode(v){ return String(v||todayInput()).replaceAll('-',''); }
function makeOrderNo(companyTitle, dept, orderDate, excludeId=''){
  const head = `${companyPrefix(companyTitle)}${deptDigit(dept)}${dateCode(orderDate)}-`;
  let max=0;
  state.orders.forEach(o=>{
    if(excludeId && o.id===excludeId) return;
    const no=String(o.orderNo||'');
    if(no.startsWith(head)){
      const n=Number(no.slice(head.length));
      if(Number.isFinite(n)) max=Math.max(max,n);
    }
  });
  return head + String(max+1).padStart(3,'0');
}
function orderNoMatches(o){
  return String(o.orderNo||'').startsWith(`${companyPrefix(o.companyTitle)}${deptDigit(o.dept)}${dateCode(o.orderDate)}-`);
}
function makeAccountingBatchNo(order, billingDate){
  const head = `AC-${companyPrefix(order?.companyTitle)}${deptDigit(order?.dept)}${dateCode(billingDate || order?.orderDate || todayInput())}-`;
  let max=0;
  state.orders.forEach(o=>{
    const no=String(o.accountingBatch||'');
    if(no.startsWith(head)){
      const n=Number(no.slice(head.length));
      if(Number.isFinite(n)) max=Math.max(max,n);
    }
  });
  return head + String(max+1).padStart(3,'0');
}

function getItem(code){ return state.settings.items.find(i=>i.code===code) || {code,name:code,spec:'',unit:'',price:0,vendorPrice:0,openingStock:0,active:true,orderType:normalizeItemOrderType('',code)}; }
function itemVendorPrice(code){ const item=getItem(code); return num(item.vendorPrice ?? item.price); }
function itemWorkerPrice(code){ const item=getItem(code); return num(item.price); }
function itemLabel(code){ const item=getItem(code); return item.name || code; }
function lineQty(line){
  if(isSpecialItem(line?.code)) return Math.max(0, num(line?.orderQty));
  return Math.max(0, num(line?.orderQty) + num(line?.addQty) + num(line?.useStockQty) - num(line?.returnQty));
}
function supplierQty(line){
  if(isSpecialItem(line?.code)) return Math.max(0, num(line?.orderQty));
  return Math.max(0, num(line?.orderQty) + num(line?.addQty) + num(line?.replenishQty) - num(line?.returnQty));
}
function lineAmount(line){ return lineQty(line) * num(line.price); }
function effectiveBicycleLines(order, qtyFn=supplierQty){
  if(Array.isArray(order?.workerGroups) && order.workerGroups.length){
    const lines=order.workerGroups.flatMap(group=>orderedLines(group.items||[]).filter(l=>isBicycleItem(l.code)&&qtyFn(l)>0));
    if(lines.length) return lines;
  }
  return orderedLines(order?.items||[]).filter(l=>isBicycleItem(l.code)&&qtyFn(l)>0);
}
function orderBicycleAmount(order){ return effectiveBicycleLines(order,lineQty).reduce((sum,l)=>sum+lineAmount(l),0); }
function orderBeddingAmount(order){ return orderedLines(order.items||[]).reduce((sum,l)=>sum+(!isBicycleItem(l.code)?lineAmount(l):0),0); }
function orderAmount(order){ return orderBeddingAmount(order) + orderBicycleAmount(order); }
function orderSupplierAmount(order){ return orderedLines(order.items||[]).reduce((sum,l)=>sum+(!isOrderFormExcludedItem(l.code)?supplierQty(l)*itemVendorPrice(l.code):0),0); }
function bicycleSupplierQty(order){ return effectiveBicycleLines(order,supplierQty).reduce((sum,l)=>sum+supplierQty(l),0); }
function hasBicycleOrder(order){ return bicycleSupplierQty(order)>0; }
function hasBeddingPurchaseOrder(order){ return orderedLines(order?.items||[]).some(l=>hasOrderLineForPrint(l) && !isOrderFormExcludedItem(l.code)); }
function bicycleOrderWorkerRows(order){
  const rows=[];
  if(Array.isArray(order?.workerGroups) && order.workerGroups.length){
    order.workerGroups.forEach(group=>{
      orderedLines(group.items||[]).filter(l=>isBicycleItem(l.code)&&supplierQty(l)>0).forEach(line=>{
        const item=getItem(line.code);
        rows.push({worker:group.name||'-',nationality:group.nationality||'',entryDate:group.entryDate||'',code:line.code,itemName:item.name||line.code,spec:item.spec||'',unit:item.unit||'台',qty:supplierQty(line),unitPrice:itemVendorPrice(line.code),note:line.note||''});
      });
    });
  }
  if(!rows.length){
    orderedLines(order?.items||[]).filter(l=>isBicycleItem(l.code)&&supplierQty(l)>0).forEach(line=>{
      const item=getItem(line.code);
      rows.push({worker:order?.isStockOrder?'訂庫存':workerFullDisplay(order),nationality:order?.isStockOrder?'':nationalityDisplay(order),entryDate:order?.isStockOrder?'':entryDateDisplay(order),code:line.code,itemName:item.name||line.code,spec:item.spec||'',unit:item.unit||'台',qty:supplierQty(line),unitPrice:itemVendorPrice(line.code),note:line.note||''});
    });
  }
  return rows;
}
function workerPurchaseNameMap(order, itemFilter=()=>true){
  const groups=orderWorkerGroups(order).filter(g=>String(g.name||'').trim());
  if(groups.length<2) return new Map();
  const groupCodes=groups.map(g=>orderedLines(g.items||[]).filter(l=>itemFilter(l.code)&&hasOrderLineForPrint(l)).map(l=>l.code).sort());
  const signatures=new Set(groupCodes.map(codes=>codes.join('|')));
  if(signatures.size<=1) return new Map();
  const buyers=new Map();
  groups.forEach((g,index)=>groupCodes[index].forEach(code=>{
    if(!buyers.has(code)) buyers.set(code,[]);
    const name=String(g.name||'').trim();
    if(name&&!buyers.get(code).includes(name)) buyers.get(code).push(name);
  }));
  return buyers;
}
function bicycleOrderItemRows(order){
  const buyerMap=workerPurchaseNameMap(order,isBicycleItem);
  const map=new Map();
  bicycleOrderWorkerRows(order).forEach(row=>{
    const key=[row.code,row.itemName,row.spec,row.unit,row.unitPrice].join('｜');
    if(!map.has(key)) map.set(key,{code:row.code,itemName:row.itemName,spec:row.spec,unit:row.unit||'台',qty:0,unitPrice:num(row.unitPrice),notes:[]});
    const target=map.get(key);
    target.qty+=num(row.qty);
    if(row.note && !target.notes.includes(row.note)) target.notes.push(row.note);
  });
  return Array.from(map.values()).map(row=>Object.assign(row,{note:row.notes.join(' / '),buyers:buyerMap.get(row.code)||[]}));
}

function returnBaseQty(line){
  if(isSpecialItem(line?.code)) return 0;
  return Math.max(0, num(line?.orderQty) + num(line?.addQty) + num(line?.useStockQty));
}
function returnRemainingQty(line){ return Math.max(0, returnBaseQty(line)-num(line?.returnQty)); }
function returnStatusText(line){
  const base=returnBaseQty(line), returned=num(line?.returnQty);
  if(returned<=0) return '未退貨';
  if(base>0 && returned>=base) return `退${returned}`;
  return `部分退貨，現有 ${returnRemainingQty(line)}`;
}
function hasReturn(order){ return orderWorkerGroups(order).some(g=>(g.items||[]).some(l=>isGeneralItem(l.code)&&num(l.returnQty)>0)) || (order.items||[]).some(l=>isGeneralItem(l.code)&&num(l.returnQty)>0); }
function itemSummary(order){
  const parts = orderedLines(order.items||[]).filter(l=>lineQty(l)>0 || supplierQty(l)>0 || (isGeneralItem(l.code) && num(l.useStockQty)>0)).map(l=>{
    const item=getItem(l.code);
    const tags=[];
    const orderQty=isSpecialItem(l.code)?lineQty(l):num(l.orderQty);
    if(orderQty>0) tags.push(`訂${orderQty}`);
    if(isGeneralItem(l.code) && num(l.useStockQty)>0) tags.push(`庫${num(l.useStockQty)}`);
    if(isGeneralItem(l.code) && num(l.returnQty)>0) tags.push(`退${num(l.returnQty)}`);
    if(isGeneralItem(l.code) && num(l.addQty)>0) tags.push(`加${num(l.addQty)}`);
    return `${item.name} ${tags.join('/')}`;
  });
  return parts.length ? parts.join('、') : '尚未填品項';
}

function purchaseItemsHTML(order){
  const isAddBuyOrder = String(order.note||'').includes('加買來源：');
  const rows = [];
  orderedLines(order.items||[]).forEach(l=>{
    const orderQty=isSpecialItem(l.code)?lineQty(l):num(l.orderQty);
    if(orderQty>0){
      const returned=isGeneralItem(l.code)?num(l.returnQty):0;
      const fullReturned=returned>0 && lineQty(l)<=0;
      if(fullReturned){
        rows.push(`<span class="plain-item-line"><span class="returned-item">${esc(itemLabel(l.code))} ${orderQty}</span><span class="return-count">退${returned}</span></span>`);
      }else{
        const label = isAddBuyOrder ? `加購 ${itemLabel(l.code)} ${orderQty}` : `${itemLabel(l.code)} ${orderQty}`;
        rows.push(`<span class="plain-item-line ${isAddBuyOrder?'add':''}">${esc(label)}</span>`);
      }
    }
    if(isGeneralItem(l.code) && num(l.useStockQty)>0){
      const label = `${itemLabel(l.code)} ${num(l.useStockQty)}`;
      rows.push(`<span class="plain-item-line stock">${esc(label)}</span>`);
    }
    if(isGeneralItem(l.code) && num(l.addQty)>0){
      rows.push(`<span class="plain-item-line add">${esc('加購 '+itemLabel(l.code)+' '+num(l.addQty))}</span>`);
    }
  });
  return rows.length ? rows.join('') : '<span class="muted">-</span>';
}
function hasOrderLineForPrint(line){ return supplierQty(line)>0 || num(line.useStockQty)>0; }
function hasReceiptLine(line){ return lineQty(line)>0; }
function returnableQty(line){ return Math.max(0, returnBaseQty(line)-num(line?.returnQty)); }
function hasEditableReturnItems(order){
  const groups=orderWorkerGroups(order);
  if(groups.length && groups.some(g=>(g.items||[]).some(l=>isGeneralItem(l.code)&&(returnBaseQty(l)>0||num(l.returnQty)>0)))) return true;
  return (order.items||[]).some(l=>isGeneralItem(l.code)&&(returnBaseQty(l)>0||num(l.returnQty)>0));
}
function hasReturnableItems(order){ return hasEditableReturnItems(order); }
function currentStock(code){
  const item = getItem(code);
  if(isSpecialItem(item)) return 0;
  let stock = num(item.openingStock);
  for(const order of state.orders){
    for(const l of (order.items||[])){
      if(l.code !== code) continue;
      if(order.isStockOrder && order.receivedDate){
        stock += Math.max(0, num(l.orderQty) + num(l.addQty) - num(l.returnQty));
      }
      stock += num(l.stockInQty || 0);
      stock += num(l.replenishQty || 0);
      stock += num(l.returnToStockQty || 0);
      stock -= num(l.useStockQty);
    }
  }
  for(const adj of state.stockAdjustments){
    if(adj.code===code) stock += num(adj.qty);
  }
  return stock;
}

function bindStableSearchInput(inputId, filterKey, renderFn, root){
  const input=$('#'+inputId);
  if(!input) return;
  let isComposing=false;
  let renderTimer=null;
  let skipNextInput=false;
  const runSearch=(immediate=false)=>{
    if(isComposing) return;
    const value=input.value;
    state.filters[filterKey]=value;
    clearTimeout(renderTimer);
    const execute=()=>{
      if(isComposing) return;
      const start=input.selectionStart ?? value.length;
      const end=input.selectionEnd ?? start;
      save();
      renderFn(root);
      requestAnimationFrame(()=>{
        const next=$('#'+inputId);
        if(!next) return;
        next.focus({preventScroll:true});
        const length=next.value.length;
        try{ next.setSelectionRange(Math.min(start,length),Math.min(end,length)); }catch(_error){}
      });
    };
    if(immediate) execute();
    else renderTimer=setTimeout(execute,180);
  };
  input.addEventListener('compositionstart',()=>{
    isComposing=true;
    clearTimeout(renderTimer);
  });
  input.addEventListener('compositionupdate',()=>{ isComposing=true; });
  input.addEventListener('compositionend',()=>{
    isComposing=false;
    skipNextInput=true;
    runSearch(true);
    setTimeout(()=>{ skipNextInput=false; },0);
  });
  input.addEventListener('input',event=>{
    if(isComposing || event.isComposing || skipNextInput) return;
    runSearch(false);
  });
  input.addEventListener('keydown',event=>{
    if(event.key==='Enter'){
      isComposing=false;
      runSearch(true);
    }else if(event.key==='Escape'){
      event.currentTarget.value='';
      isComposing=false;
      runSearch(true);
    }
  });
  input.addEventListener('paste',()=>{ isComposing=false; });
  input.addEventListener('blur',()=>{
    isComposing=false;
    state.filters[filterKey]=input.value;
    save();
  });
}

  const status = state.filters.status || '全部';
  return state.orders.filter(o=>{
    if(o.accountingBatch) return false;
    const hit = !q || [o.orderNo,o.employer,o.worker,o.nationality,o.dept,o.staff,o.companyTitle,o.deliveryPlace,itemSummary(o),entryDateDisplay(o),displayStatus(o),o.isStockOrder?'訂庫存':'工人訂購'].some(v=>String(v||'').toLowerCase().includes(q));

    return hit && st;
  }).sort((a,b)=>String(b.orderDate||'').localeCompare(String(a.orderDate||'')) || String(b.orderNo||'').localeCompare(String(a.orderNo||'')));

function applyBatchReceiveDate(){
  const ids = getSelectedOrderIds();
  const date = $('#batchReceiveDate')?.value || todayInput();

function moveOrdersToAccounting(ids, date, batch, overseasStaff){
  const selectedOrders = state.orders.filter(o=>ids.includes(o.id));
  if(!selectedOrders.length) return;
  const batchNo = batch || makeAccountingBatchNo(selectedOrders[0], date || todayInput());
  let count = 0;
  state.orders.forEach(o=>{
    if(ids.includes(o.id)){
      o.billingDate = date || todayInput();
      o.accountingBatch = batchNo;
      o.accountingStatus = '待對帳';
      o.status = '待對帳';
      o.overseasStaff = overseasStaff || o.overseasStaff || o.staff || '';
      if(typeof o.accountingAdjust === 'undefined') o.accountingAdjust = 0;
      if(typeof o.accountingNote === 'undefined') o.accountingNote = '';
      count++;
    }
  });
  if(count){ save(); toast(`已請款並轉入會計對帳批次：${batchNo}`); render(); }
}
function requestSelectedAccounting(){
  const ids = getSelectedOrderIds();
  const date = $('#batchBillingDate')?.value || todayInput();
  if(!ids.length) return toast('請先勾選要請款 / 轉入會計對帳的資料');
  const selectedOrders = state.orders.filter(o=>ids.includes(o.id));
  const total = selectedOrders.reduce((s,o)=>s+accountingAmount(o),0);
  const overseasStaff = prompt(`請輸入海外承辦：`, selectedOrders[0]?.overseasStaff || selectedOrders[0]?.staff || '');
  if(overseasStaff===null) return;
  if(!String(overseasStaff).trim()) return toast('請輸入海外承辦');

對帳總金額：${money(total)}
海外承辦：${overseasStaff}`)) return;

  if(!orderId) return;

function updateDeliveryInputs(modal, fromPlaceChange){
  const place = $('#f_deliveryPlace',modal)?.value || '';
  const staff = $('#f_staff',modal)?.value || '';
  const contact = $('#f_contact',modal);
  const address = $('#f_deliveryAddress',modal);
  if(!contact || !address) return;
  if(place===KANG_PLACE){
    contact.value = staffContact(staff);
    contact.readOnly = true;
    address.value = KANG_PLACE;
    address.readOnly = true;
    return;
  }
  contact.readOnly = false;
  address.readOnly = false;
  const matches=activeDeliveryContacts(place);
  if(fromPlaceChange){
    const first=matches[0] || null;
    contact.value = first ? contactDisplay(first) : '';
    address.value = first?.address || '';
    return;
  }
  const selected=findDeliveryContact(contact.value,place) || findDeliveryContact(contact.value);
  if(selected && selected.address && !address.value) address.value=selected.address;
}
function applyConfiguredContact(modal){
  const contact=$('#f_contact',modal);
  const place=$('#f_deliveryPlace',modal);
  const address=$('#f_deliveryAddress',modal);
  if(!contact || !place || !address) return;
  const selected=findDeliveryContact(contact.value);
  if(!selected) return;
  if(selected.deliveryPlace && Array.from(place.options).some(opt=>opt.value===selected.deliveryPlace)) place.value=selected.deliveryPlace;
  if(selected.address) address.value=selected.address;
}

function copyFirstWorkerItemsToAll(modal){

  const sourceMap=new Map($all('tr[data-code]',cards[0]).map(tr=>[tr.dataset.code,{
    price:$('.line-price',tr)?.value||'0', order:$('.line-order',tr)?.value||'0', stock:$('.line-use-stock',tr)?.value||'0', add:$('.line-add',tr)?.value||'0', note:$('.line-note',tr)?.value||''

function normalizeSpecialLine(line){
  const l=normalizeItemLine(line||{});
  const qty=Math.max(0,num(l.orderQty)+num(l.addQty)+num(l.useStockQty)-num(l.returnQty));
  return Object.assign(l,{orderQty:qty,addQty:0,returnQty:0,useStockQty:0,stockInQty:0,replenishQty:0,returnToStockQty:0,receivedQty:0});
}
function specialItemRowsHTML(items){
  const itemMap = new Map((items||[]).map(l=>[l.code,l]));
  const specialItems = state.settings.items.filter(i=>i.active!==false && isSpecialItem(i));
  return specialItems.map(item=>{
    const l = normalizeSpecialLine(itemMap.get(item.code) || {code:item.code,price:item.price});
    return `<tr data-code="${esc(item.code)}">
      <td><b>${esc(item.name)}</b><br><span class="muted">${esc(item.spec||'')}｜不綁定工人，同張訂購單只填一次</span></td>

      <td><input class="line-note" value="${esc(l.note||'')}"></td>
    </tr>`;
  }).join('');
}
function positiveLineQty(line){ return isSpecialItem(line?.code) ? num(line?.orderQty)>0 : (supplierQty(line)>0 || num(line.useStockQty)>0 || num(line.addQty)>0 || num(line.orderQty)>0 || num(line.returnQty)>0); }
function mergeSpecialLines(baseLines, specialLines){
  const map = new Map((baseLines||[]).map(l=>[l.code, normalizeItemLine(l)]));
  (specialLines||[]).forEach(raw=>{
    if(!isSpecialItem(raw?.code)) return;
    map.set(raw.code, normalizeSpecialLine(raw));
  });
  const ordered=state.settings.items.filter(i=>i.active!==false).map(i=>map.get(i.code) || normalizeItemLine({code:i.code,price:i.price}));
  const known=new Set(ordered.map(l=>l.code));
  (baseLines||[]).forEach(raw=>{ if(!known.has(raw.code)) ordered.push(normalizeItemLine(raw)); });
  return ordered;
}

function readLinesFromRoot(root){

function saveOrderFromModal(id, isExisting, modal){
  const order = isExisting ? (state.orders.find(o=>o.id===id) || createBlankOrder()) : createBlankOrder();
  const beforeOrder = isExisting ? snapshotOrder(order) : null;
  const oldItems = order.items || [];
  order.isStockOrder = !!$('#f_isStockOrder', modal)?.checked;
  const fields = ['dept','staff','employer','orderDate','companyTitle','paymentTarget','deliveryDate','deliveryHour','deliveryPlace','contact','deliveryAddress','bicycleDeliveryDate','bicycleDeliveryHour','bicycleContact','bicycleDeliveryAddress','receivedDate','status','note'];
  const map = {dept:'f_dept',staff:'f_staff',employer:'f_employer',orderDate:'f_orderDate',companyTitle:'f_companyTitle',paymentTarget:'f_paymentTarget',deliveryDate:'f_deliveryDate',deliveryHour:'f_deliveryHour',deliveryPlace:'f_deliveryPlace',contact:'f_contact',deliveryAddress:'f_deliveryAddress',bicycleDeliveryDate:'f_bicycleDeliveryDate',bicycleDeliveryHour:'f_bicycleDeliveryHour',bicycleContact:'f_bicycleContact',bicycleDeliveryAddress:'f_bicycleDeliveryAddress',receivedDate:'f_receivedDate',status:'f_status',note:'f_note'};
  fields.forEach(k=>{ order[k] = modal.querySelector('#'+map[k])?.value || ''; });
  order.invoiceTitle = invoiceTitleFromSettings(order.companyTitle,state.settings);
  order.provideDate = order.orderDate;
  if(order.isStockOrder){
    order.employer=KANG_PLACE; order.worker=''; order.workerGroups=[]; order.nationality=''; order.entryDate='';
    order.items = readLinesFromRoot($('.stock-item-section', modal));
  }else{
    const groups = readWorkerGroupsFromModal(modal);
    const specialLines = $('.special-bed-section', modal) ? readLinesFromRoot($('.special-bed-section', modal)).map(normalizeSpecialLine) : [];
    for(const g of groups){
      for(const l of (g.items||[])){
        const max=returnBaseQty(l);
        if(num(l.returnQty)>max) return toast(`${g.name||'工人'}｜${itemLabel(l.code)} 退貨入庫數量不可超過 ${max}`);
        if(num(l.returnQty)>0 && !l.returnUpdatedAt) l.returnUpdatedAt=todayInput();
      }
    }
    const hasWorkerItems = groups.some(g=>(g.items||[]).some(l=>positiveLineQty(l)));
    const hasSpecialItems = specialLines.some(l=>positiveLineQty(l));
    if(!groups.length && !hasSpecialItems) return toast('請至少輸入一位工人或特殊訂購項目');
    if(groups.length && !hasWorkerItems && !hasSpecialItems) return toast('請輸入至少一個訂購品項');
    order.workerGroups = groups;
    order.worker = groups.map(g=>g.name).filter(Boolean).join('\n');
    order.nationality = groups[0]?.nationality || '';
    order.entryDate = groups[0]?.entryDate || '';
    order.items = mergeSpecialLines(aggregateWorkerItems(groups, oldItems), specialLines);
    order.returnedAt = groups.some(g=>(g.items||[]).some(l=>num(l.returnQty)>0)) ? (order.returnedAt||todayInput()) : '';
  }
  if(matchedEmployerPaymentRule(order.employer)) order.paymentTarget = effectivePaymentTarget(order);
  if(!isExisting || !order.orderNo || String(order.orderNo).startsWith('BO')) order.orderNo = makeOrderNo(order.companyTitle, order.dept, order.orderDate, isExisting ? order.id : '');
  order.batchNo = '';
  order.workerEnglish = '';
  if(!order.accountingBatch) order.overseasStaff = order.staff || '';
  if(order.deliveryPlace===KANG_PLACE){ order.contact = staffContact(order.staff); order.deliveryAddress = KANG_PLACE; }
  if(!isExisting){ state.orders.push(order); }
  if(order.employer && !state.settings.employers.includes(order.employer)) state.settings.employers.push(order.employer);
  audit(isExisting?'修改訂購':'新增訂購','訂購單',order.id,order.orderNo,`${order.employer||''}｜${workerDisplay(order)}｜${money(orderAmount(order))}`,beforeOrder);
  save(); closeModal(); toast('訂購資料已儲存'); render();
}
function deleteOrder(id){
  const order = state.orders.find(o=>o.id===id);
  if(!order) return;
  if(!confirm('確定要刪除此筆訂購資料？刪除後可到「控管資訊」救回。')) return;
  state.deletedOrders = Array.isArray(state.deletedOrders) ? state.deletedOrders : [];
  state.deletedOrders.unshift({id:uid('DEL'), deletedAt:nowStamp(), deletedBy:'共用網址', order:snapshotOrder(order)});
  state.orders = state.orders.filter(o=>o.id!==id);
  audit('刪除訂購','訂購單',order.id,order.orderNo,`${order.employer||''}｜${workerDisplay(order)}｜可救回`,order);
  save(); closeModal(); toast('已刪除，可於控管資訊救回'); render();
}

function openReturnToStockModal(orderId){
  const o=state.orders.find(x=>x.id===orderId); if(!o) return;
  if(!can('orderWrite')) return toast('目前無法辦理退貨');
  const groups=orderWorkerGroups(o);
  const candidates=[];
  if(!o.isStockOrder && groups.length){
    groups.forEach((g,gidx)=>orderedLines(g.items||[]).forEach(l=>{
      if(isGeneralItem(l.code) && (returnBaseQty(l)>0 || num(l.returnQty)>0)) candidates.push({gidx,worker:g.name||`工人${gidx+1}`,line:l});
    }));
  }else{
    orderedLines(o.items||[]).forEach(l=>{ if(isGeneralItem(l.code) && (returnBaseQty(l)>0 || num(l.returnQty)>0)) candidates.push({gidx:-1,worker:'庫存／未指定工人',line:l}); });
  }
  if(!candidates.length) return toast('此筆沒有可設定退貨入庫的品項');
  const hadReturn=candidates.some(c=>num(c.line.returnQty)>0);
  const rows=candidates.map(c=>{
    const it=getItem(c.line.code);
    const current=num(c.line.returnQty), base=returnBaseQty(c.line);
    return `<tr data-return-group="${c.gidx}" data-return-code="${esc(c.line.code)}">
      <td><b>${esc(c.worker)}</b></td>
      <td><b>${esc(it.name)}</b><br><span class="muted">${esc(it.spec||'')}</span></td>
      <td class="right">${base}</td>
      <td class="right">${current}</td>
      <td><input type="number" min="0" step="1" max="${base}" class="return-qty" value="${current}"></td>
      <td><input class="return-note" value="${esc(c.line.returnNote||'')}" placeholder="退貨原因 / 備註"></td>
    </tr>`;
  }).join('');
  showModal(`${hadReturn?'修改':'新增'}退貨入庫｜${o.orderNo}`, `
    <div class="mini-note" style="margin-bottom:10px">可直接修改既有退貨的工人、品項數量與備註。將數量改為 0 即取消該品項退貨；庫存與訂單金額會同步重算。</div>
    <div class="scroll-x"><table class="item-table return-edit-table"><thead><tr><th>工人</th><th>品項</th><th class="right">可退總數</th><th class="right">目前退貨</th><th>修改後退貨數量</th><th>退貨備註</th></tr></thead><tbody>${rows}</tbody></table></div>`,{
    width:'1080px',
    footer:`<button id="cancelModalBtn">取消</button><button class="primary" id="saveReturnBtn">儲存退貨入庫</button>`,
    onOpen:(modal)=>{
      $('#cancelModalBtn',modal).addEventListener('click',closeModal);
      $('#saveReturnBtn',modal).addEventListener('click',()=>{
        const realGroups=orderWorkerGroups(o);
        const updates=[];
        let total=0;
        $all('tr[data-return-code]',modal).forEach(tr=>{
          const code=tr.dataset.returnCode;
          const gidx=Number(tr.dataset.returnGroup);
          const line=gidx>=0 ? (realGroups[gidx]?.items||[]).find(l=>l.code===code) : (o.items||[]).find(l=>l.code===code);
          if(!line) return;
          const qty=Math.max(0,num($('.return-qty',tr).value));
          const max=returnBaseQty(line);
          const note=($('.return-note',tr).value||'').trim();
          if(qty>max){ updates.push({error:`${gidx>=0?(realGroups[gidx]?.name||'工人')+'｜':''}${itemLabel(code)} 退貨數量不可超過 ${max}`}); return; }
          updates.push({gidx,line,qty,note,oldQty:num(line.returnQty)});
          total+=qty;
        });
        const err=updates.find(u=>u.error); if(err) return toast(err.error);
        if(!hadReturn && total<=0) return toast('請輸入至少一個退貨數量');
        updates.forEach(u=>{
          u.line.returnQty=u.qty;
          u.line.returnToStockQty=u.qty;
          u.line.returnNote=u.qty>0?u.note:'';
          u.line.returnUpdatedAt=u.qty>0?todayInput():'';
        });
        if(realGroups.length){
          const special=(o.items||[]).filter(l=>isSpecialItem(l.code)).map(normalizeSpecialLine);
          o.workerGroups=realGroups;
          o.items=mergeSpecialLines(aggregateWorkerItems(realGroups,o.items),special);
        }
        o.returnedAt=total>0?todayInput():'';
        if(o.status==='對帳完成' && total>0) o.status='已收貨';
        if(matchedEmployerPaymentRule(o.employer)) o.paymentTarget=effectivePaymentTarget(o);
        audit(hadReturn?'修改退貨入庫':'新增退貨入庫','訂購單',o.id,o.orderNo,`退貨總數 ${total}`);
        save(); closeModal(); toast(total>0?`退貨入庫已更新，共 ${total} 件`:'已取消全部退貨入庫'); render();
      });
    }
  });
}
function openAddPurchaseFlow(orderId){
  const o=state.orders.find(x=>x.id===orderId); if(!o) return;
  if(!can('orderWrite')) return toast('目前無法辦理加買');
  const useStock = confirm('這次加買是否直接拿庫存？\n\n確定＝拿庫存\n取消＝新增一張加買訂購單');
  if(useStock) return openAddFromStockModal(orderId);
  const addOrder = createBlankOrder();
  addOrder.dept=o.dept; addOrder.staff=o.staff; addOrder.employer=o.employer; addOrder.companyTitle=o.companyTitle; addOrder.paymentTarget=o.paymentTarget||'雇主';
  addOrder.deliveryPlace=o.deliveryPlace; addOrder.contact=o.contact; addOrder.deliveryAddress=o.deliveryAddress; addOrder.orderDate=todayInput(); addOrder.status='已下單'; addOrder.note=`加買來源：${o.orderNo}`;

    addOrder.items=createEmptyItemLines(i=>isGeneralItem(i));

  state.orders.push(addOrder); save(); closeModal(); toast('已建立加買訂購單，請填寫加買品項'); openOrderModal(addOrder.id);
}
function openAddFromStockModal(orderId){
  const o=state.orders.find(x=>x.id===orderId); if(!o) return;
  const groups=orderWorkerGroups(o);
  const targetSelect = (!o.isStockOrder && groups.length>1) ? `<div style="margin-bottom:10px"><label>加買對象</label><select id="add_stock_worker">${groups.map((g,i)=>`<option value="${i}">${esc(g.name||('工人'+(i+1)))}</option>`).join('')}</select></div>` : '';
  const rows=state.settings.items.filter(i=>i.active!==false && isGeneralItem(i)).map(i=>`<tr data-add-code="${esc(i.code)}"><td><b>${esc(i.name)}</b><br><span class="muted">庫存 ${currentStock(i.code)}｜${esc(i.spec||'')}</span></td><td class="right">${money(i.price)}</td><td><input type="number" min="0" step="1" class="add-stock-qty" value="0"></td><td><input class="add-stock-note" placeholder="備註"></td></tr>`).join('');

    width:'880px',
    footer:`<button id="cancelModalBtn">取消</button><button class="primary" id="saveAddStockBtn">儲存加買拿庫存</button>`,
    onOpen:(modal)=>{
      $('#cancelModalBtn',modal).addEventListener('click',closeModal);
      $('#saveAddStockBtn',modal).addEventListener('click',()=>{
        let total=0;
        const updates=[];
        $all('tr[data-add-code]',modal).forEach(tr=>{
          const qty=num($('.add-stock-qty',tr)?.value); if(qty<=0) return;
          const code=tr.dataset.addCode; const note=$('.add-stock-note',tr)?.value||'';
          updates.push({code,qty,note}); total+=qty;
        });
        if(!updates.length) return toast('請輸入至少一個加買拿庫存數量');
        if(!o.isStockOrder && groups.length){
          const idx=num($('#add_stock_worker',modal)?.value || 0);
          const realGroups=orderWorkerGroups(o);
          const g=realGroups[idx] || realGroups[0];
          updates.forEach(u=>{
            let line=(g.items||[]).find(l=>l.code===u.code);
            if(!line){ line=normalizeItemLine({code:u.code}); g.items.push(line); }
            line.useStockQty=num(line.useStockQty)+u.qty;
            line.note=[line.note||'',`加買拿庫存 ${today()} x${u.qty}${u.note?'：'+u.note:''}`].filter(Boolean).join(' / ');
          });
          o.workerGroups=realGroups;
          o.items=aggregateWorkerItems(realGroups, o.items);
        }else{
          updates.forEach(u=>{
            let line=(o.items||[]).find(l=>l.code===u.code);
            if(!line){ line=normalizeItemLine({code:u.code}); o.items.push(line); }
            line.useStockQty=num(line.useStockQty)+u.qty;
            line.note=[line.note||'',`加買拿庫存 ${today()} x${u.qty}${u.note?'：'+u.note:''}`].filter(Boolean).join(' / ');
          });
        }
        o.note=[o.note||'',`加買拿庫存 ${today()} 共${total}件`].filter(Boolean).join('\n');
        save(); closeModal(); toast(`已加買拿庫存 ${total} 件`); render();
      });
    }
  });
}

function matrixLineCell(l){
  if(!l || !positiveLineQty(l)) return '<span class="muted">-</span>';
  const parts=[];
  const ordered=num(l.orderQty), stock=num(l.useStockQty), added=num(l.addQty), returned=num(l.returnQty);
  if(ordered>0) parts.push(`<span class="order-qty">${ordered}</span>`);
  if(stock>0) parts.push(`<span class="stock-line">${stock}</span>`);
  if(added>0) parts.push(`<span>加買 ${added}</span>`);
  if(returned>0) parts.push(`<span class="return-line">退貨入庫 ${returned}</span>`);
  if(stock>0 || added>0 || returned>0) parts.push(`<span class="remaining-line">目前有效 ${lineQty(l)}</span>`);
  const note = l.returnNote ? `<span class="mini">退貨備註：${esc(l.returnNote)}</span>` : (l.note ? `<span class="mini">${esc(l.note)}</span>` : '');
  return `<div class="matrix-cell">${parts.join('')}${note}</div>`;
}
function matrixItemPrice(groups, code){
  for(const g of groups){
    const l=(g.items||[]).find(x=>x.code===code && positiveLineQty(x));
    if(l) return num(l.price);
  }
  return itemWorkerPrice(code);
}

function workerChangeDetails(o){
  const rows=[];
  const isAddOrder=String(o?.note||'').includes('加買來源：');
  orderWorkerGroups(o).forEach((g,gidx)=>{
    orderedLines(g.items||[]).forEach(l=>{
      const base={worker:g.name||`工人${gidx+1}`,code:l.code,item:itemLabel(l.code),note:l.note||''};
      if(num(l.returnQty)>0) rows.push({...base,type:'退貨入庫',qty:num(l.returnQty),note:l.returnNote||l.note||'',updatedAt:l.returnUpdatedAt||''});
      if(num(l.addQty)>0) rows.push({...base,type:'加買',qty:num(l.addQty)});
      if(isAddOrder && num(l.orderQty)>0) rows.push({...base,type:'加買',qty:num(l.orderQty)});
      const stockMatches=[...String(l.note||'').matchAll(/加買拿庫存[^x×]*[x×](\d+(?:\.\d+)?)/g)];
      stockMatches.forEach(m=>rows.push({...base,type:'加買拿庫存',qty:num(m[1])}));
    });
  });
  if(!rows.length){
    orderedLines(o?.items||[]).forEach(l=>{
      if(num(l.returnQty)>0) rows.push({worker:'未指定工人',code:l.code,item:itemLabel(l.code),type:'退貨入庫',qty:num(l.returnQty),note:l.returnNote||l.note||'',updatedAt:l.returnUpdatedAt||''});
      if(num(l.addQty)>0) rows.push({worker:'未指定工人',code:l.code,item:itemLabel(l.code),type:'加買',qty:num(l.addQty),note:l.note||''});
    });
  }
  return rows;
}

function accountingAmount(o){ return orderAmount(o) + num(o.accountingAdjust || 0); }
function accountingBatchFileName(batch){ return String(batch||'會計批次').replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,'_'); }
function accountingOrderDetailRows(order){
  const rows=[];
  const covered=new Map();
  const add=(worker,nationality,entryDate,line,qtyOverride=null)=>{
    const qty=qtyOverride===null?lineQty(line):Math.max(0,num(qtyOverride));
    if(qty<=0) return;
    const item=getItem(line.code);
    const unitPrice=num(line.price ?? item.price);
    rows.push({
      order,
      worker:worker||'-',
      nationality:nationality||'',
      entryDate:entryDate||'',
      code:line.code,
      itemName:item.name||line.code,
      spec:item.spec||'',
      unit:item.unit||'',
      qty,
      unitPrice,
      amount:qty*unitPrice,
      paymentTarget:paymentTargetLabel(resolvedLinePaymentTarget(order,line))
    });
  };
  if(order.isStockOrder){
    orderedLines(order.items||[]).forEach(line=>add('訂庫存','','',line));
    return rows;
  }
  if(Array.isArray(order.workerGroups) && order.workerGroups.length){
    order.workerGroups.forEach(group=>{
      orderedLines(group.items||[]).forEach(line=>{
        const qty=lineQty(line);
        if(qty<=0) return;
        add(group.name||order.worker||'未指定工人',group.nationality||order.nationality||'',group.entryDate||order.entryDate||'',line,qty);
        covered.set(line.code,(covered.get(line.code)||0)+qty);
      });
    });
    orderedLines(order.items||[]).forEach(line=>{
      const qty=lineQty(line);
      if(qty<=0) return;
      if(isSpecialItem(line.code)) return add('不綁定工人','','',line,qty);
      const diff=Math.max(0,qty-(covered.get(line.code)||0));
      if(diff>0) add(order.worker||'未指定工人',order.nationality||'',order.entryDate||'',line,diff);
    });
    return rows;
  }
  orderedLines(order.items||[]).forEach(line=>add(order.worker||'未指定工人',order.nationality||'',order.entryDate||'',line));
  return rows;
}
function accountingBatchHorizontalItemCodes(orders){
  const used=new Set();
  (orders||[]).forEach(order=>accountingOrderDetailRows(order).forEach(row=>used.add(row.code)));
  const result=[];
  (state.settings.items||[]).forEach(item=>{ if(used.has(item.code)){ result.push(item.code); used.delete(item.code); } });
  used.forEach(code=>result.push(code));
  return result;
}
function accountingOrderWorkerSummary(order){
  if(order.isStockOrder) return '訂庫存';
  const names=orderWorkers(order);
  return names.length?names.join('、'):(order.worker||'-');
}
function accountingOrderNationalitySummary(order){
  if(order.isStockOrder) return '';
  const values=(Array.isArray(order.workerGroups)&&order.workerGroups.length)?order.workerGroups.map(group=>group.nationality||order.nationality||'').filter(Boolean):[order.nationality||''].filter(Boolean);
  return [...new Set(values)].join('、');
}
function accountingOrderEntryDateSummary(order){
  if(order.isStockOrder) return '';
  const values=(Array.isArray(order.workerGroups)&&order.workerGroups.length)?order.workerGroups.map(group=>group.entryDate||order.entryDate||'').filter(Boolean):[order.entryDate||''].filter(Boolean);

function accountingWorkerHorizontalRows(order,itemCodes){
  const detailRows=accountingOrderDetailRows(order);
  const groups=new Map();
  detailRows.forEach(detail=>{
    const key=[detail.worker,detail.nationality,detail.entryDate].join('||');
    if(!groups.has(key)) groups.set(key,{worker:detail.worker,nationality:detail.nationality,entryDate:detail.entryDate,itemMap:new Map(),targets:new Set()});
    const group=groups.get(key);
    const value=group.itemMap.get(detail.code)||{qty:0,amount:0};
    value.qty+=detail.qty; value.amount+=detail.amount;
    group.itemMap.set(detail.code,value);
    group.targets.add(detail.paymentTarget);
  });
  if(!groups.size){
    groups.set('empty',{worker:accountingOrderWorkerSummary(order),nationality:accountingOrderNationalitySummary(order),entryDate:accountingOrderEntryDateSummary(order),itemMap:new Map(),targets:new Set([paymentTargetLabel(effectivePaymentTarget(order))])});
  }
  return Array.from(groups.values()).map(group=>({...group,paymentTarget:group.targets.size===1?Array.from(group.targets)[0]:'分項支付'}));
}
function downloadAccountingBatchDetail(batch){
  const orders=state.orders.filter(order=>order.accountingBatch===batch).sort((a,b)=>String(a.orderNo||'').localeCompare(String(b.orderNo||''),'zh-Hant'));
  if(!orders.length) return toast('此批次沒有可下載的訂單');
  const itemCodes=accountingBatchHorizontalItemCodes(orders);
  const headers=['對帳批次','訂購單號','訂購日','雇主','工人','國籍','入境日','支付對象'];
  itemCodes.forEach(code=>{ const name=itemLabel(code)||code; headers.push(`${name}｜數量`,`${name}｜金額`); });
  headers.push('原金額','調整金額','對帳金額','會計狀態','對帳人','備註');
  const rows=[headers];
  const batchItemTotals=new Map(itemCodes.map(code=>[code,{qty:0,amount:0}]));
  orders.forEach(order=>{
    const workerRows=accountingWorkerHorizontalRows(order,itemCodes);
    workerRows.forEach((workerRow,index)=>{
      const row=[order.accountingBatch||'',order.orderNo||'',dateSlash(order.orderDate)||'',order.employer||'',workerRow.worker,workerRow.nationality,dateSlash(workerRow.entryDate)||'',workerRow.paymentTarget];
      itemCodes.forEach(code=>{
        const value=workerRow.itemMap.get(code)||{qty:0,amount:0};
        row.push(value.qty||'',value.amount||'');
        const total=batchItemTotals.get(code); total.qty+=value.qty; total.amount+=value.amount;
      });
      row.push(index===0?orderAmount(order):'',index===0?num(order.accountingAdjust||0):'',index===0?accountingAmount(order):'',index===0?(order.accountingStatus||'待對帳'):'',index===0?(order.accountingBy||''):'',index===0?(order.accountingNote||order.note||''):'');
      rows.push(row);
    });
  });
  const totalRow=['','批次總計','','','','','',''];
  itemCodes.forEach(code=>{ const value=batchItemTotals.get(code)||{qty:0,amount:0}; totalRow.push(value.qty||'',value.amount||''); });
  totalRow.push(orders.reduce((sum,order)=>sum+orderAmount(order),0),orders.reduce((sum,order)=>sum+num(order.accountingAdjust||0),0),orders.reduce((sum,order)=>sum+accountingAmount(order),0),'','','');
  rows.push(totalRow);
  downloadCSV(`${accountingBatchFileName(batch)}_全部訂單明細_工人橫向.csv`,rows);
  toast(`已下載 ${batch} 工人橫向明細`);
}

function lineSummaryByKey(o, key, cls=''){
  const labelPrefix=key==='useStockQty'?'':key==='returnQty'?'退':key==='addQty'?'加買 ':'';
  const textClass=key==='useStockQty'?'stock':key==='returnQty'?'return':key==='addQty'?'add':cls;
  const rows=orderedLines(o.items||[]).filter(l=>(key==='orderQty' || isGeneralItem(l.code)) && (key==='orderQty'&&isSpecialItem(l.code)?lineQty(l):num(l[key]))>0).map(l=>{
    const qty=key==='orderQty'&&isSpecialItem(l.code)?lineQty(l):num(l[key]);
    const returned=num(l.returnQty), fullReturned=key==='orderQty'&&returned>0&&lineQty(l)<=0;
    if(fullReturned) return `<span class="plain-item-line"><span class="returned-item">${esc(itemLabel(l.code))} ${qty}</span><span class="return-count">退${returned}</span></span>`;
    if(key==='returnQty') return `<span class="plain-item-line ${textClass}">${esc(itemLabel(l.code))}<span class="return-count">退${qty}</span></span>`;
    return `<span class="plain-item-line ${textClass}">${esc(labelPrefix+itemLabel(l.code)+' '+qty)}</span>`;
  });
  return rows.length ? rows.join('') : '<span class="muted">-</span>';
}

function availableStatYears(){
  const set = new Set([String(new Date().getFullYear())]);
  state.orders.forEach(o=>{ const y=String(o.orderDate||'').slice(0,4); if(/^\d{4}$/.test(y)) set.add(y); });
  return Array.from(set).sort((a,b)=>b.localeCompare(a));
}
function filteredStatOrders(){
  const mode = state.filters.statsMode || 'month';
  return state.orders.filter(o=>{
    const d = String(o.orderDate||'');
    if(mode==='year') return d.slice(0,4) === String(state.filters.statsYear || new Date().getFullYear());
    if(mode==='month') return d.slice(0,7) === String(state.filters.statsMonth || todayInput().slice(0,7));
    if(mode==='range'){
      const start = state.filters.statsStart || '';
      const end = state.filters.statsEnd || '';
      if(start && d < start) return false;
      if(end && d > end) return false;
      return !!d;
    }
    return true;
  });
}
function statsRangeLabel(){
  const mode = state.filters.statsMode || 'month';
  if(mode==='year') return `${state.filters.statsYear || new Date().getFullYear()} 年`;
  if(mode==='month') return `${String(state.filters.statsMonth || todayInput().slice(0,7)).replace('-',' 年 ')} 月`;
  const s = state.filters.statsStart ? dateSlash(state.filters.statsStart) : '最早';
  const e = state.filters.statsEnd ? dateSlash(state.filters.statsEnd) : '今日';
  return `${s} ～ ${e}`;
}

function monthlyStatsHTML(orders=state.orders){
  const map={};

function restoreDeletedOrder(deleteId){
  const deleted = (state.deletedOrders||[]).find(d=>d.id===deleteId);
  if(!deleted || !deleted.order) return;
  if(!confirm(`確定救回訂購單 ${deleted.order.orderNo||''}？`)) return;
  const restored = snapshotOrder(deleted.order);
  if(state.orders.some(o=>o.id===restored.id)) restored.id = uid('ORD');
  state.orders.push(restored);
  state.deletedOrders = (state.deletedOrders||[]).filter(d=>d.id!==deleteId);
  audit('救回訂購','訂購單',restored.id,restored.orderNo,`${restored.employer||''}｜${workerDisplay(restored)}`);
  save(); toast('已救回訂購單'); renderControlInfo($('#content'));
}
function purgeDeletedOrder(deleteId){
  const deleted = (state.deletedOrders||[]).find(d=>d.id===deleteId);
  if(!deleted) return;
  if(!confirm('確定永久移除？移除後無法再救回。')) return;
  state.deletedOrders = (state.deletedOrders||[]).filter(d=>d.id!==deleteId);
  audit('永久移除刪除資料','訂購單',deleted.order?.id,deleted.order?.orderNo,'已從刪除救回清單移除');
  save(); toast('已永久移除'); renderControlInfo($('#content'));
}
function exportAuditCSV(){
  const rows=[['時間','來源','動作','對象','ID','名稱/單號','內容']];
  (state.auditLogs||[]).forEach(l=>rows.push([l.time,l.source||l.user||l.role||'共用網址',l.action,l.targetType,l.targetId,l.targetName,l.detail]));
  downloadBlob('FOR-e寢具訂購_控管異動紀錄_'+todayInput()+'.csv', toCSV(rows), 'text/csv;charset=utf-8');
}

function savePaymentRuleFromModal(id,modal){
  const employer=$('#payrule_employer',modal).value.trim();
  const mode=$('#payrule_mode',modal).value;
  const itemKeywords=String($('#payrule_keywords',modal)?.value||'').split(/\r?\n|[、,，;；]+/).map(x=>x.trim()).filter(Boolean);
  if(!employer) return toast('請輸入雇主名稱或關鍵字');
  if(mode!=='all' && !itemKeywords.length) return toast('請至少輸入一個指定品項關鍵字');
  const data=normalizePaymentRule({
    id:id||uid('PAY'), employer,
    target:$('#payrule_target',modal).value,
    mode, itemKeywords,
    fallbackTarget:$('#payrule_fallback',modal).value,
    note:$('#payrule_note',modal)?.value||'',
    active:$('#payrule_active',modal).value==='true'
  });
  const idx=(state.settings.paymentRules||[]).findIndex(r=>r.id===id);
  if(idx>=0) state.settings.paymentRules[idx]=data; else state.settings.paymentRules.push(data);
  if(!state.settings.employers.some(x=>employerMatchesRule(x,employer))) state.settings.employers.push(employer);
  audit(idx>=0?'修改支付規則':'新增支付規則','支付規則',data.id,data.employer,paymentRuleSummary(data));
  save(); toast('支付對象規則已儲存'); closeModal(); renderSettings($('#content'));
}
function deletePaymentRule(id){
  const rule=(state.settings.paymentRules||[]).find(r=>r.id===id);
  if(!rule) return;
  if(!confirm(`確定刪除「${rule.employer}」的支付規則？`)) return;
  state.settings.paymentRules=(state.settings.paymentRules||[]).filter(r=>r.id!==id);
  audit('刪除支付規則','支付規則',id,rule.employer,paymentRuleSummary(rule));
  save(); toast('支付規則已刪除'); renderSettings($('#content'));
}

function moveSettingItem(code,direction){
  const visible=settingsItemsForDisplay();
  const visibleIdx=visible.findIndex(i=>i.code===code);
  if(visibleIdx<0) return;
  const targetVisibleIdx=direction==='up'?visibleIdx-1:visibleIdx+1;
  if(targetVisibleIdx<0 || targetVisibleIdx>=visible.length) return;
  const targetCode=visible[targetVisibleIdx].code;
  const idx=state.settings.items.findIndex(i=>i.code===code);
  const target=state.settings.items.findIndex(i=>i.code===targetCode);
  if(idx<0 || target<0) return;
  [state.settings.items[idx],state.settings.items[target]]=[state.settings.items[target],state.settings.items[idx]];
  const item=state.settings.items[target];
  audit('調整品項順序','品項',code,item.name,`${direction==='up'?'上移':'下移'}至顯示第 ${targetVisibleIdx+1} 順位`);
  save(); toast('品項順序已更新'); renderSettings($('#content'));
}

      });

function lineMessage(o){
  const lines = [
    '您好，麻煩協助安排寢具，資訊如下：',
    `雇主：${o.employer||''}`,
    `訂購日期：${dateSlash(o.orderDate)||today()}`,
    ...(formatDeliveryDeadline(o) ? [`送達時間：${formatDeliveryDeadline(o)}`] : []),
    `公司別：${o.companyTitle||''}`,
    `發票開立抬頭：${orderInvoiceTitle(o)||''}`,
    `工人：${workerFullDisplay(o)}`,
    `承辦人：${o.staff||''}`
  ];
  if(isKangDelivery(o)){
    lines.push(`送貨地點：${KANG_PLACE}`);
    if(deliveryContact(o)) lines.push(`收貨聯絡人：${deliveryContact(o)}`);
  }else if(o.deliveryPlace || o.deliveryAddress){
    if(o.deliveryPlace) lines.push(`送貨地點：${o.deliveryPlace}`);
    if(deliveryContact(o)) lines.push(`收貨聯絡人：${deliveryContact(o)}`);
    if(deliveryAddress(o)) lines.push(`送貨地址：${deliveryAddress(o)}`);
  }
  if(o.note) lines.push(`備註：${o.note}`);
  return lines.join('\n');
}

function receiptPagesHTML(o){
  if(o.isStockOrder) return '';
  const groups = orderWorkerGroups(o).filter(g=>(g.items||[]).some(l=>hasReceiptLine(l)) || g.name);
  const receiptGroups = groups.length ? groups : [{name:o.worker||'-', nationality:o.nationality||'其他', entryDate:o.entryDate||'', items:o.items||[]}];
  return receiptGroups.map(g=>{
    const langKey = g.nationality || o.nationality || '其他';
    const lang = itemTranslations[langKey] || itemTranslations['其他'];
    const receiptLines = orderedLines(g.items||[]).filter(l=>hasReceiptLine(l) && isGeneralItem(l.code));
    const lines = receiptLines.length ? receiptLines : [{code:'',price:0,note:'',__empty:true}];
    const workerSubtotal=groupAmount(g);
    const groupRows=lines.map((l,idx)=>{
      const first=idx===0;
      const rowSpan=lines.length;
      const workerCell=first ? `<td class="worker-cell" rowspan="${rowSpan}"><b>${esc(g.name||'-')}</b><br><span>${esc(langKey||'')}</span><br><span>入境日：${esc(dateSlash(g.entryDate)||'')}</span><br><span class="worker-subtotal">小計：${money(workerSubtotal)}</span></td>` : '';
      const signCell=first ? `<td class="worker-sign" rowspan="${rowSpan}"><span>簽名</span><div class="signature-space"></div><span>日期</span><div class="date-line"></div></td>` : '';
      if(l.__empty){
        return `<tr>${workerCell}<td class="center muted">尚無有訂購數量的品項</td><td class="right">-</td><td class="center">-</td><td>-</td><td>-</td>${signCell}</tr>`;
      }
      const qty=lineQty(l);
      return `<tr>${workerCell}<td>${receiptProductHTML(l.code, langKey, lang)}</td><td class="right">${money(l.price)}</td><td class="center"><b>${qty}</b></td><td>${esc(paymentTargetLabel(resolvedLinePaymentTarget(o,l)))}</td><td>${esc(l.note||'')}</td>${signCell}</tr>`;
    }).join('');
  const beddingTotal=groupBeddingAmount(g);
  const bicycleTotal=groupBicycleAmount(g);
  const total=beddingTotal+bicycleTotal;
  const amountRows = bicycleTotal>0
    ? `<p class="sub-total">寢具及用品費用：${money(beddingTotal)}</p><p class="bike-total">腳踏車費用：${money(bicycleTotal)}</p><p class="total">總金額：${money(total)}</p>`
    : `<p class="total">總金額：${money(total)}</p>`;
  const densityClass=lines.length>22?' receipt-ultra-compact':(lines.length>13?' receipt-compact':'');
  return `<section class="receipt-page${densityClass}">
    <h1>入境寢具簽收單</h1>
    <table class="info receipt-order-info"><tr><td>雇主名稱：<b>${esc(o.employer||'')}</b></td><td>訂購單號：<b>${esc(o.orderNo||'')}</b></td></tr><tr><td>工人姓名：<b>${esc(g.name||'-')}</b></td><td>訂購日期：<b>${esc(dateSlash(o.orderDate)||'')}</b></td></tr></table>
    <table class="receipt-worker-table"><thead><tr><th>工人資料</th><th>品項</th><th>單價</th><th>數量</th><th>支付對象</th><th>備註</th><th>工人簽名／日期</th></tr></thead><tbody>${groupRows}</tbody></table>
    <div class="amount-breakdown">${amountRows}</div>
    <table class="info receipt-footer-sign"><tr><td class="sign">翻譯人員：____________________</td><td class="sign">承辦人員：____________________</td></tr></table>
  </section>`;
  }).join('');
}

function drawCenteredWrap(ctx, text, x, y, maxWidth, lineHeight, maxLines=2){
  text=String(text||'');
  if(!text) return;
  const oldAlign=ctx.textAlign;
  ctx.textAlign='center';
  let line='', lines=[];
  for(let i=0;i<text.length;i++){
    const test=line+text[i];
    if(ctx.measureText(test).width>maxWidth && line){ lines.push(line); line=text[i]; if(lines.length>=maxLines-1){ if(i<text.length-1) line += '…'; break; } }
    else line=test;
  }
  if(line) lines.push(line);
  const startY = y - ((lines.length-1)*lineHeight/2);
  lines.forEach((ln,idx)=>ctx.fillText(ln, x+maxWidth/2, startY+idx*lineHeight));
  ctx.textAlign=oldAlign;
}
function canvasWrapLines(ctx, text, maxWidth){
  text = String(text||'');
  if(!text) return [''];
  const lines=[]; let line='';
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(ch==='\n'){ lines.push(line); line=''; continue; }
    const test=line+ch;
    if(ctx.measureText(test).width>maxWidth && line){ lines.push(line); line=ch; }
    else line=test;
  }
  if(line || !lines.length) lines.push(line);
  return lines;
}
function drawCenteredWrapFull(ctx, text, x, y, maxWidth, boxH, lineHeight){
  const oldAlign=ctx.textAlign;
  ctx.textAlign='center';
  const lines=canvasWrapLines(ctx, text, maxWidth);
  const totalH=lines.length*lineHeight;
  let startY=y + Math.max(lineHeight, (boxH-totalH)/2 + lineHeight*.78);
  lines.forEach((ln,idx)=>ctx.fillText(ln, x+maxWidth/2, startY+idx*lineHeight));
  ctx.textAlign=oldAlign;
}

function bindExportDateFilter(renderFn, root){
  const updateVisibility = ()=>{

function exportDateMatches(o){
  const f = state.filters;
  const mode = f.exportMode || 'month';
  const d = String(o.orderDate || o.billingDate || '').slice(0,10);
  if(!d) return false;
  if(mode==='year') return d.slice(0,4) === String(f.exportYear || new Date().getFullYear());
  if(mode==='month') return d.slice(0,7) === String(f.exportMonth || todayInput().slice(0,7));
  if(mode==='day') return d === String(f.exportDay || todayInput());
  if(mode==='range'){
    const start = f.exportStart || '';
    const end = f.exportEnd || '';
    return (!start || d >= start) && (!end || d <= end);
  }
  return true;
}
function filteredOrdersForCSV(orders){ return (orders || state.orders).filter(exportDateMatches); }
function exportDateLabel(){

function crc32Table(){ const table=new Uint32Array(256); for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);table[n]=c>>>0;}return table; }

const downloadOrderImageBase=downloadOrderImage;
downloadOrderImage=async function(orderId){
  const order=state.orders.find(o=>o.id===orderId);if(!order)return;
  const captured=[],originalTrigger=triggerCanvasDownload;
  triggerCanvasDownload=(canvas,fileName)=>captured.push({canvas,fileName});
  try{downloadOrderImageBase(orderId);}finally{triggerCanvasDownload=originalTrigger;}
  if(!captured.length)return toast('沒有可下載的訂購單');
  const preview=window.open('','_blank');
  if(preview){
    preview.document.open();
    preview.document.write('<!doctype html><html><head><meta charset="UTF-8"><title>訂購單 PNG 預覽</title></head><body style="font-family:Arial,sans-serif;text-align:center;padding:32px;color:#555">訂購單 PNG 預覽載入中…</body></html>');
    preview.document.close();
  }else{
    toast('訂購單會正常下載；預覽視窗遭瀏覽器阻擋，請允許此網站開啟彈出式視窗');
  }
  const base=orderDownloadFileName(order);
  const entries=[];
  for(const item of captured){const isBike=String(item.fileName).includes('腳踏車');entries.push({name:`${base}_${isBike?'2腳踏車訂購單':'1寢具訂購單'}.png`,blob:await orderCanvasBlob(item.canvas)});}
  entries.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
  if(entries.length===1) downloadGeneratedBlob(entries[0].name,entries[0].blob);
  else downloadGeneratedBlob(`${base}_訂購單.zip`,await createOrderZip(entries));
  if(preview && !preview.closed){
    const imageUrls=entries.map(entry=>({name:entry.name,url:URL.createObjectURL(entry.blob)}));
    if(imageUrls.length===1){
      preview.location.replace(imageUrls[0].url);
    }else{
      preview.document.open();
      preview.document.write(`<!doctype html><html><head><meta charset="UTF-8"><title>訂購單 PNG 預覽</title><style>body{margin:0;padding:24px;background:#e9ecef;font-family:"Microsoft JhengHei",sans-serif}section{max-width:1400px;margin:0 auto 28px;background:#fff;padding:16px;box-shadow:0 2px 10px #0002}h2{font-size:18px;margin:0 0 12px;color:#333}img{display:block;width:100%;height:auto}</style></head><body>${imageUrls.map(item=>`<section><h2>${esc(item.name)}</h2><img src="${item.url}" alt="${esc(item.name)}"></section>`).join('')}</body></html>`);
      preview.document.close();
    }
    preview.focus();
  }
  toast(entries.length>1?'已下載 ZIP：1寢具訂購單、2腳踏車訂購單':'已下載訂購單');
};
